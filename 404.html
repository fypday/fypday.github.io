<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Content Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0f172a; 
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .mesh-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, #1e3a8a 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #581c87 0%, transparent 40%);
            filter: blur(80px);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .video-preview {
            position: relative;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop'); /* Gambar abstrak/blur */
            background-size: cover;
            background-position: center;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
        }
        .preview-overlay {
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-red {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .glow-button {
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }
        .glow-button:hover {
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
    <div class="mesh-gradient"></div>

    <div class="glass-card max-w-sm w-full p-6 rounded-[2.5rem] shadow-2xl text-center relative overflow-hidden">
        <!-- Badge Trending -->
        <div class="absolute top-4 right-6">
            <span class="flex items-center gap-1 bg-red-600 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider animate-bounce">
                <span class="w-2 h-2 bg-white rounded-full pulse-red"></span> Live Now
            </span>
        </div>

        <!-- Video Thumbnail Preview -->
        <div class="video-preview mb-6 mt-4 group cursor-pointer" id="videoTrigger">
            <div class="preview-overlay absolute inset-0 group-hover:bg-black/40 transition-all">
                <div class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border border-white/30 transform group-hover:scale-110 transition-transform">
                    <i class="fas fa-play text-white text-2xl ml-1"></i>
                </div>
            </div>
            <!-- Progress Bar Fake -->
            <div class="absolute bottom-0 left-0 h-1 bg-red-600 w-2/3"></div>
        </div>
        
        <!-- Text Content -->
        <div class="space-y-2 mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight">
                Private Video <span class="text-blue-500">Unlocked</span>
            </h1>
            <p class="text-slate-400 text-sm">
                Full 4K Ultra HD • <span class="text-slate-300">18:42 mins</span>
            </p>
            <div class="flex justify-center gap-2 mt-2">
                <div class="bg-slate-800 text-[10px] text-slate-300 px-2 py-1 rounded">HEVC x265</div>
                <div class="bg-slate-800 text-[10px] text-slate-300 px-2 py-1 rounded">60 FPS</div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="startBtn" class="glow-button group relative w-full bg-blue-600 text-white font-bold py-4 rounded-xl overflow-hidden active:scale-95">
            <span class="relative z-10 flex items-center justify-center gap-3 text-base">
                WATCH FULL VIDEO
                <i class="fas fa-external-link-alt text-xs opacity-70 group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
            </span>
        </button>

        <!-- Stats -->
        <div class="mt-6 pt-6 border-t border-white/5 flex items-center justify-around text-slate-500 text-[11px]">
            <span class="flex flex-col gap-1">
                <b class="text-white text-sm">2.4M</b> VIEWS
            </span>
            <span class="w-[1px] h-8 bg-white/10"></span>
            <span class="flex flex-col gap-1">
                <b class="text-white text-sm">98%</b> RATING
            </span>
            <span class="w-[1px] h-8 bg-white/10"></span>
            <span class="flex flex-col gap-1">
                <i class="fas fa-shield-halved text-green-500 mb-1"></i> VERIFIED
            </span>
        </div>
    </div>

    <script>
        const handleAction = () => {
            window.open('watch.html', '_blank');
            window.location.href = 'https://loadads1.blogspot.com/';
        };

        document.getElementById('startBtn').addEventListener('click', handleAction);
        document.getElementById('videoTrigger').addEventListener('click', handleAction);
    </script>

    <!-- Histats -->
    <script type='text/javascript'>
        var _Hasync=_Hasync||[];
        _Hasync.push(['Histats.start', '1,5009418,4,0,0,0,00010000']);
        _Hasync.push(['Histats.fasi', '1']);
        _Hasync.push(['Histats.track_hits', '']);
        (function(){
            var hs = document.createElement('script'); hs.async = true;
            hs.src = '//s10.histats.com/js15_as.js';
            (document.head||document.body).appendChild(hs);
        })();
    </script>
</body>
</html>
